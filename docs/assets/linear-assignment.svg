<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" width="940" height="420" role="img" aria-labelledby="t d">
<title id="t">Row-wise argmin versus linear assignment</title>
<desc id="d">A 3 by 3 cost matrix. Picking the cheapest task per worker sends two workers to the same task. Linear assignment chooses the one-to-one matching with the lowest total cost, 5 plus 2 plus 4 equals 11.</desc>
<defs></defs>
<style>
  .bg { fill: #101216; stroke: #2b2f36; stroke-width: 1.5; }
  text { font-family: "STIX Two Text", "Latin Modern Roman", Cambria, Georgia, "Times New Roman", serif; fill: #ece6e2; }
  .muted { fill: #9aa0aa; }
  .title { font-size: 21px; font-weight: 600; }
  .sub { font-size: 14px; }
  .cap { font-size: 15.5px; }
  .capb { font-size: 17px; font-weight: 600; }
  .num { font-size: 21px; text-anchor: middle; dominant-baseline: central; }
  .var { font-size: 17px; font-style: italic; text-anchor: middle; dominant-baseline: central; }
  .hdr { font-size: 14px; text-anchor: middle; fill: #9aa0aa; }
  .rowhdr { font-size: 14px; text-anchor: end; fill: #9aa0aa; }
  .cell { fill: #181b20; stroke: #2b2f36; stroke-width: 1.2; }
  .blue { fill: #58C4DD; } .teal { fill: #5CD0B3; } .green { fill: #83C167; } .yellow { fill: #F7D96F; }
  .gold { fill: #F0AC5F; } .red { fill: #FC6255; }

  @keyframes ka0 { 0%, 10.00% { opacity: 0 } 11.20%, 95% { opacity: 1 } 99%, 100% { opacity: 0 } }
  .a0 { opacity: 0; animation: ka0 15.0s ease-in-out infinite; }
  @keyframes ka1 { 0%, 26.67% { opacity: 0 } 27.87%, 95% { opacity: 1 } 99%, 100% { opacity: 0 } }
  .a1 { opacity: 0; animation: ka1 15.0s ease-in-out infinite; }
  @keyframes ka2 { 0%, 36.67% { opacity: 0 } 37.87%, 95% { opacity: 1 } 99%, 100% { opacity: 0 } }
  .a2 { opacity: 0; animation: ka2 15.0s ease-in-out infinite; }
  @keyframes ka3 { 0%, 53.33% { opacity: 0 } 54.53%, 95% { opacity: 1 } 99%, 100% { opacity: 0 } }
  .a3 { opacity: 0; animation: ka3 15.0s ease-in-out infinite; }
  @keyframes ka4 { 0%, 66.67% { opacity: 0 } 67.87%, 95% { opacity: 1 } 99%, 100% { opacity: 0 } }
  .a4 { opacity: 0; animation: ka4 15.0s ease-in-out infinite; }
  @keyframes ka5 { 0%, 76.67% { opacity: 0 } 77.87%, 95% { opacity: 1 } 99%, 100% { opacity: 0 } }
  .a5 { opacity: 0; animation: ka5 15.0s ease-in-out infinite; }
</style>
<rect class="bg" x="1" y="1" width="938" height="418" rx="14"/>
<text class="title" x="30" y="44">Row-wise argmin</text>
<text class="sub muted" x="30" y="68">every worker picks its cheapest task, alone</text>
<text class="hdr" x="133" y="104">task 0</text>
<text class="hdr" x="209" y="104">task 1</text>
<text class="hdr" x="285" y="104">task 2</text>
<text class="rowhdr" x="90" y="145">worker 0</text>
<rect class="cell" x="100" y="114" width="66" height="44" rx="7"/>
<text class="num" x="133" y="136">1</text>
<rect class="cell" x="176" y="114" width="66" height="44" rx="7"/>
<text class="num" x="209" y="136">5</text>
<rect class="cell" x="252" y="114" width="66" height="44" rx="7"/>
<text class="num" x="285" y="136">9</text>
<text class="rowhdr" x="90" y="197">worker 1</text>
<rect class="cell" x="100" y="166" width="66" height="44" rx="7"/>
<text class="num" x="133" y="188">2</text>
<rect class="cell" x="176" y="166" width="66" height="44" rx="7"/>
<text class="num" x="209" y="188">7</text>
<rect class="cell" x="252" y="166" width="66" height="44" rx="7"/>
<text class="num" x="285" y="188">9</text>
<text class="rowhdr" x="90" y="249">worker 2</text>
<rect class="cell" x="100" y="218" width="66" height="44" rx="7"/>
<text class="num" x="133" y="240">8</text>
<rect class="cell" x="176" y="218" width="66" height="44" rx="7"/>
<text class="num" x="209" y="240">3</text>
<rect class="cell" x="252" y="218" width="66" height="44" rx="7"/>
<text class="num" x="285" y="240">4</text>
<text class="title" x="500" y="44">Linear assignment</text>
<text class="sub muted" x="500" y="68">the one-to-one matching with the lowest total cost</text>
<text class="hdr" x="603" y="104">task 0</text>
<text class="hdr" x="679" y="104">task 1</text>
<text class="hdr" x="755" y="104">task 2</text>
<text class="rowhdr" x="560" y="145">worker 0</text>
<rect class="cell" x="570" y="114" width="66" height="44" rx="7"/>
<text class="num" x="603" y="136">1</text>
<rect class="cell" x="646" y="114" width="66" height="44" rx="7"/>
<text class="num" x="679" y="136">5</text>
<rect class="cell" x="722" y="114" width="66" height="44" rx="7"/>
<text class="num" x="755" y="136">9</text>
<text class="rowhdr" x="560" y="197">worker 1</text>
<rect class="cell" x="570" y="166" width="66" height="44" rx="7"/>
<text class="num" x="603" y="188">2</text>
<rect class="cell" x="646" y="166" width="66" height="44" rx="7"/>
<text class="num" x="679" y="188">7</text>
<rect class="cell" x="722" y="166" width="66" height="44" rx="7"/>
<text class="num" x="755" y="188">9</text>
<text class="rowhdr" x="560" y="249">worker 2</text>
<rect class="cell" x="570" y="218" width="66" height="44" rx="7"/>
<text class="num" x="603" y="240">8</text>
<rect class="cell" x="646" y="218" width="66" height="44" rx="7"/>
<text class="num" x="679" y="240">3</text>
<rect class="cell" x="722" y="218" width="66" height="44" rx="7"/>
<text class="num" x="755" y="240">4</text>
<g class="a0"><rect x="100" y="114" width="66" height="44" rx="7" fill="#2f2a17" stroke="#F0AC5F" stroke-width="2.5"/><text class="num" x="133" y="136" style="font-weight:700">1</text></g>
<g class="a0"><rect x="100" y="166" width="66" height="44" rx="7" fill="#2f2a17" stroke="#F0AC5F" stroke-width="2.5"/><text class="num" x="133" y="188" style="font-weight:700">2</text></g>
<g class="a0"><rect x="176" y="218" width="66" height="44" rx="7" fill="#2f2a17" stroke="#F0AC5F" stroke-width="2.5"/><text class="num" x="209" y="240" style="font-weight:700">3</text></g>
<g class="a1"><rect x="100" y="114" width="66" height="44" rx="7" fill="#33171a" stroke="#FC6255" stroke-width="2.5"/><text class="num" x="133" y="136" style="font-weight:700">1</text></g>
<g class="a1"><rect x="100" y="166" width="66" height="44" rx="7" fill="#33171a" stroke="#FC6255" stroke-width="2.5"/><text class="num" x="133" y="188" style="font-weight:700">2</text></g>
<text class="a1 red" x="133" y="92" style="font-size:14px;font-weight:600" text-anchor="middle">taken twice</text>
<text class="a1 red" x="285" y="282" style="font-size:14px;font-weight:600" text-anchor="middle">never used</text>
<text class="cap a0" x="30" y="318">1. every worker grabs its cheapest task <tspan class="gold">(gold)</tspan></text>
<text class="cap a1" x="30" y="344">2. task 0 is claimed twice <tspan class="red">(red)</tspan>, task 2 by nobody</text>
<text class="cap red a2" x="30" y="370" style="font-weight:600">not a matching: the total 6 cannot be paid</text>
<text class="cap muted a3" x="500" y="318">1. compare all 6 one-to-one matchings: totals 11 to 24</text>
<g class="a4"><rect x="646" y="114" width="66" height="44" rx="7" fill="#1d2d19" stroke="#83C167" stroke-width="2.5"/><text class="num" x="679" y="136" style="font-weight:700">5</text></g>
<g class="a4"><rect x="570" y="166" width="66" height="44" rx="7" fill="#1d2d19" stroke="#83C167" stroke-width="2.5"/><text class="num" x="603" y="188" style="font-weight:700">2</text></g>
<g class="a4"><rect x="722" y="218" width="66" height="44" rx="7" fill="#1d2d19" stroke="#83C167" stroke-width="2.5"/><text class="num" x="755" y="240" style="font-weight:700">4</text></g>
<text class="cap a4" x="500" y="344">2. keep the cheapest <tspan class="green">(green)</tspan>: 5 + 2 + 4 = 11</text>
<text class="cap green a5" x="500" y="370" style="font-weight:600">every worker and every task used once</text>
<line x1="478" y1="30" x2="478" y2="404" stroke="#2b2f36" stroke-width="1.5" stroke-dasharray="5 5"/>
</svg>
