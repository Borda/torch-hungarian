name: Modal GPU Tests (reusable)

# Ported from https://github.com/Borda/affordable-GPU-CI
# The callers live in gpu-tests.yml and gpu-tests-label.yml.

on:
  workflow_call:
    inputs:
      ref:
        description: "Branch or commit SHA to test"
        required: false
        type: string
        default: ""
      gpu:
        description: "Modal GPU request; compute capability 8.0+ only, so no T4"
        required: false
        type: string
        default: "L4"
      python_version:
        description: "Python version of the Modal container image"
        required: false
        type: string
        default: "3.12"
      test_path:
        description: "Path passed to pytest"
        required: false
        type: string
        default: "tests/"
      pytest_args:
        description: "Extra pytest arguments"
        required: false
        type: string
        default: "-v"
      min_devices:
        description: "Eligible CUDA devices the run requires; 2 exercises the multi-device lane"
        required: false
        type: number
        default: 1
    secrets:
      MODAL_TOKEN_ID:
        required: true
      MODAL_TOKEN_SECRET:
        required: true

permissions:
  contents: read

jobs:
  gpu-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      with:
        ref: ${{ inputs.ref }}
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
      with:
        python-version: "3.12"

    # Only the Modal client runs here; the test environment is built inside the
    # Modal image from the pinned develop dependency group.
    - name: Install the Modal client
      run: |
        python -m pip install "uv==0.9.26"
        uv pip install --system "modal==1.5.5"

    - name: Run the GPU tests on Modal
      env:
        MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
        MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        MODAL_GPU: ${{ inputs.gpu }}
        MODAL_PYTHON_VERSION: ${{ inputs.python_version }}
        # Passed through the environment rather than interpolated into the
        # command line, so workflow inputs cannot inject shell syntax.
        TEST_PATH: ${{ inputs.test_path }}
        PYTEST_ARGS: ${{ inputs.pytest_args }}
        MIN_DEVICES: ${{ inputs.min_devices }}
      run: >-
        modal run .modal/test_runner.py
        --test-path "$TEST_PATH"
        --pytest-args "$PYTEST_ARGS"
        --min-devices "$MIN_DEVICES"

    - name: Upload the pytest log
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
      with:
        name: gpu-pytest-output
        path: test-outputs/pytest-output.log
        if-no-files-found: warn
        retention-days: 30
