name: Modal GPU Tests (reusable)

# Ported from https://github.com/Borda/affordable-GPU-CI
# The callers live in dispatch_gpu-tests.yml and trigger-gpu-labels.yml. One `gpu-tests-run` leg runs
# per entry of `nb_devices`: the one-device leg runs the whole suite, and a leg with more devices
# requests that many GPUs and runs only the tests marked `multi_device`, which skip on one GPU. The
# `gpu-tests-report` job comments every leg's log on the pull request when the caller was one, and
# removes the trigger label.

on:
  workflow_call:
    inputs:
      ref:
        description: "Branch or commit SHA to test"
        required: false
        type: string
        default: ""
      gpu:
        description: "Modal GPU type without a device count; compute capability 8.0+ only, so no T4. L4 also allows A10 and L40S"
        required: false
        type: string
        default: "L4"
      python_version:
        description: "Python version of the Modal container image"
        required: false
        type: string
        default: "3.12"
      test_path:
        description: "Path passed to pytest"
        required: false
        type: string
        default: "tests/"
      pytest_args:
        description: "Extra pytest arguments"
        required: false
        type: string
        default: "-v"
      nb_devices:
        description: "JSON list of distinct positive device counts; defaults to [1, 2] when the selected revision has multi-device tests, otherwise [1]"
        required: false
        type: string
        default: ""
    secrets:
      MODAL_TOKEN_ID:
        required: true
      MODAL_TOKEN_SECRET:
        required: true

permissions:
  contents: read

jobs:
  gpu-tests-resolve:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.checkout.outputs.commit }}
      legs: ${{ steps.devices.outputs.legs }}
    steps:
    # Resolve a moving branch once so both the matrix and the report refer to the same workload revision.
    - id: checkout
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      with:
        ref: ${{ inputs.ref || github.sha }}
        sparse-checkout: tests
        persist-credentials: false

    # The `python` shell below runs this step's script as a Python file; set Python up so the
    # command is on the path whatever the runner image ships.
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
      with:
        python-version: "3.12"

    - name: Resolve device counts
      id: devices
      env:
        REQUESTED_DEVICES: ${{ inputs.nb_devices }}
      run: |
        import json
        import os
        import subprocess

        requested = os.environ["REQUESTED_DEVICES"]
        # Older workload revisions have the original tests but no multi_device marker. Inspect the
        # tracked suite without importing code from the requested revision.
        grep = subprocess.run(
            ["git", "grep", "-q", "-E", r"^[[:space:]]*@pytest\.mark\.multi_device", "HEAD", "--", "tests/"],
            check=False,
        )
        assert grep.returncode in (0, 1), "could not inspect the workload revision for multi_device tests"
        has_multi_device = grep.returncode == 0

        legs = json.loads(requested) if requested else [1, 2] if has_multi_device else [1]
        assert isinstance(legs, list) and legs, "nb_devices must be a non-empty JSON list"
        assert all(type(n) is int and n > 0 for n in legs), "nb_devices must hold positive integers"
        assert len(set(legs)) == len(legs), "nb_devices must hold distinct counts"
        assert has_multi_device or max(legs) == 1, "this workload revision has no multi_device tests; use nb_devices=[1]"

        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
            print(f"legs={json.dumps(legs)}", file=output)
      shell: python

  gpu-tests-run:
    needs: gpu-tests-resolve
    # The leg is part of the name, so the names stay unique and the report can read each leg's result.
    name: gpu-tests-run (${{ matrix.nb_devices }} GPU)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nb_devices: ${{ fromJSON(needs.gpu-tests-resolve.outputs.legs) }}
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      with:
        ref: ${{ needs.gpu-tests-resolve.outputs.sha }}
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
      with:
        python-version: "3.12"

    # Only the Modal client runs here; the test environment is built inside the
    # Modal image from the pinned develop dependency group.
    - name: Set up uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      with:
        version: "0.9.26"
        enable-cache: false

    - name: Install the Modal client
      run: uv pip install --system --group modal

    - name: Run the GPU tests on Modal
      env:
        MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
        MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        # A fresh Modal workspace can default to builder 2023.12, whose Debian 11
        # base no longer serves its security packages, so `apt-get install git`
        # fails with 404. Pinning the builder here keeps the image on Debian 12.
        MODAL_IMAGE_BUILDER_VERSION: "2025.06"
        MODAL_ENVIRONMENT: torch-hungarian
        MODAL_GPU: ${{ matrix.nb_devices > 1 && format('{0}:{1}', inputs.gpu, matrix.nb_devices) || inputs.gpu }}
        MODAL_PYTHON_VERSION: ${{ inputs.python_version }}
        # Passed through the environment rather than interpolated into the
        # command line, so workflow inputs cannot inject shell syntax.
        TEST_PATH: ${{ inputs.test_path }}
        # Only the multi-device tests need the extra GPUs; the one-device leg already ran the rest.
        PYTEST_ARGS: ${{ matrix.nb_devices > 1 && format('{0} -m multi_device', inputs.pytest_args) || inputs.pytest_args }}
        MIN_DEVICES: ${{ matrix.nb_devices }}
      run: >-
        modal run .modal/test_runner.py
        --test-path "$TEST_PATH"
        --pytest-args "$PYTEST_ARGS"
        --min-devices "$MIN_DEVICES"

    - name: Upload the pytest log
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
      with:
        name: gpu-pytest-output-${{ matrix.nb_devices }}gpu
        path: test-outputs/pytest-output.log
        if-no-files-found: warn
        retention-days: 30

  gpu-tests-report:
    needs: [gpu-tests-resolve, gpu-tests-run]
    if: always() && github.event_name == 'pull_request' && needs.gpu-tests-resolve.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      # `actions: read` lets the script read each leg's job result.
      actions: read
      contents: read
      pull-requests: write
    steps:
    # Load the reporter from the workflow revision, which can be newer than the workload.
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      with:
        ref: ${{ github.workflow_sha }}
        sparse-checkout: .github/scripts
        persist-credentials: false

    # One artifact per leg; each lands in its own directory under test-outputs.
    - name: Download the pytest logs
      continue-on-error: true
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
      with:
        pattern: gpu-pytest-output-*
        path: test-outputs

    - name: Comment the result on the pull request
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
      env:
        GPU_JOB_RESULT: ${{ needs.gpu-tests-run.result }}
        LEGS: ${{ needs.gpu-tests-resolve.outputs.legs }}
        # The commit the tests ran on; the run can start well after the label.
        TESTED_SHA: ${{ needs.gpu-tests-resolve.outputs.sha }}
      with:
        script: |
          const { report } = require('./.github/scripts/gpu-test-report.js');
          await report({ github, context, core });

    - name: Remove the trigger label
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
      continue-on-error: true
      with:
        script: |
          await github.rest.issues.removeLabel({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.payload.pull_request.number,
            name: 'run-gpu-tests',
          });
