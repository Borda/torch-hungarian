name: Modal GPU Tests (reusable)

# Ported from https://github.com/Borda/affordable-GPU-CI
# The callers live in dispatch_gpu-tests.yml and trigger-gpu-labels.yml. The `gpu-tests-report` job
# comments the log on the pull request when the caller was one, and removes the trigger label.

on:
  workflow_call:
    inputs:
      ref:
        description: "Branch or commit SHA to test"
        required: false
        type: string
        default: ""
      gpu:
        description: "Modal GPU request; compute capability 8.0+ only, so no T4"
        required: false
        type: string
        default: "L4"
      python_version:
        description: "Python version of the Modal container image"
        required: false
        type: string
        default: "3.12"
      test_path:
        description: "Path passed to pytest"
        required: false
        type: string
        default: "tests/"
      pytest_args:
        description: "Extra pytest arguments"
        required: false
        type: string
        default: "-v"
      min_devices:
        description: "Eligible CUDA devices the run requires; 2 exercises the multi-device lane"
        required: false
        type: number
        default: 1
    secrets:
      MODAL_TOKEN_ID:
        required: true
      MODAL_TOKEN_SECRET:
        required: true

permissions:
  contents: read

jobs:
  gpu-tests-run:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      with:
        ref: ${{ inputs.ref }}
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
      with:
        python-version: "3.12"

    # Only the Modal client runs here; the test environment is built inside the
    # Modal image from the pinned develop dependency group.
    - name: Set up uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      with:
        version: "0.9.26"
        enable-cache: false

    - name: Install the Modal client
      run: uv pip install --system --group modal

    - name: Run the GPU tests on Modal
      env:
        MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
        MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        # A fresh Modal workspace can default to builder 2023.12, whose Debian 11
        # base no longer serves its security packages, so `apt-get install git`
        # fails with 404. Pinning the builder here keeps the image on Debian 12.
        MODAL_IMAGE_BUILDER_VERSION: "2025.06"
        MODAL_ENVIRONMENT: torch-hungarian
        MODAL_GPU: ${{ inputs.gpu }}
        MODAL_PYTHON_VERSION: ${{ inputs.python_version }}
        # Passed through the environment rather than interpolated into the
        # command line, so workflow inputs cannot inject shell syntax.
        TEST_PATH: ${{ inputs.test_path }}
        PYTEST_ARGS: ${{ inputs.pytest_args }}
        MIN_DEVICES: ${{ inputs.min_devices }}
      run: >-
        modal run .modal/test_runner.py
        --test-path "$TEST_PATH"
        --pytest-args "$PYTEST_ARGS"
        --min-devices "$MIN_DEVICES"

    - name: Upload the pytest log
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
      with:
        name: gpu-pytest-output
        path: test-outputs/pytest-output.log
        if-no-files-found: warn
        retention-days: 30

  gpu-tests-report:
    needs: gpu-tests-run
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
    # Only the comment helper is needed. It comes from the commit the tests ran on.
    - id: checkout
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        sparse-checkout: .github/scripts
        persist-credentials: false

    - name: Download the pytest log
      id: download
      continue-on-error: true
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
      with:
        name: gpu-pytest-output
        path: test-outputs

    - name: Comment the result on the pull request
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
      env:
        GPU_JOB_RESULT: ${{ needs.gpu-tests-run.result }}
        # The commit the tests ran on; the run can start well after the label.
        TESTED_SHA: ${{ steps.checkout.outputs.commit }}
      with:
        script: |
          const fs = require('fs');
          const { testedCommitLine } = require('./.github/scripts/tested-commit.js');
          const path = 'test-outputs/pytest-output.log';
          const jobResult = process.env.GPU_JOB_RESULT;

          // A green check or a red cross up front, so the outcome is clear while scrolling the thread.
          const icon = jobResult === 'success' ? '✅' : '❌';
          let comment = `## ${icon} GPU test results\n\n**Job result:** ${icon} \`${jobResult}\`\n\n`;
          comment += `${await testedCommitLine({ github, context, sha: process.env.TESTED_SHA })}\n\n`;

          if (fs.existsSync(path)) {
            // eslint-disable-next-line no-control-regex
            const output = fs.readFileSync(path, 'utf8').replace(/\x1b\[[0-9;]*m/g, '');
            const summary = output.split('\n').filter(line => line.includes('passed') || line.includes('failed')).pop();
            if (summary) {
              comment += `**Summary:** ${summary.trim()}\n\n`;
            }
            comment += '<details>\n<summary>Full test output</summary>\n\n```\n';
            comment += output.substring(0, 60000);
            if (output.length > 60000) {
              comment += '\n... truncated, see the workflow artifact for the full log\n';
            }
            comment += '```\n</details>\n';
          } else {
            comment += 'No pytest log was produced. The GPU eligibility gate or the install step failed; see the workflow logs.\n';
          }

          comment += `\n[Workflow run](${context.payload.repository.html_url}/actions/runs/${context.runId})`;

          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.payload.pull_request.number,
            body: comment,
          });

    - name: Remove the trigger label
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
      continue-on-error: true
      with:
        script: |
          await github.rest.issues.removeLabel({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.payload.pull_request.number,
            name: 'gpu-tests',
          });
