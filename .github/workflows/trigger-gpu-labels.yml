name: Modal GPU (label-triggered)

# A GPU run costs real money and needs the Modal credentials, so it stays
# behind a maintainer-applied label. The trigger is deliberately
# `pull_request` and never `pull_request_target`: GitHub withholds secrets from
# fork pull requests, so untrusted code cannot reach the Modal credentials even
# if the label is applied by mistake.
#
# One label event starts one run, which the run name labels with the label. GitHub cannot filter
# the trigger by label name and a job cannot pick its reusable workflow from an expression, so each
# lane job carries an `if:` on the label: `gpu-tests` calls the test workflow and `gpu-benchmarks`
# the benchmark workflow, and each reports on its own. The lane job the label did not select is
# skipped, and any other label skips both. Job names are unique across the workflows.

run-name: "Modal GPU: ${{ github.event.label.name }} on #${{ github.event.pull_request.number }}"

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  gpu-tests-label:
    if: github.event.label.name == 'gpu-tests'
    # The report job comments on the pull request; a caller can only pass on permissions it holds itself.
    permissions:
      actions: read
      contents: read
      pull-requests: write
    uses: ./.github/workflows/_modal-gpu-tests.yml
    with:
      ref: ${{ github.event.pull_request.head.sha }}
    secrets: inherit

  gpu-benchmarks-label:
    if: github.event.label.name == 'gpu-benchmarks'
    # The benchmark report job needs these; a caller can only pass on permissions it holds itself.
    permissions:
      actions: read
      contents: read
      pull-requests: write
    uses: ./.github/workflows/_modal-gpu-benchmarks.yml
    secrets: inherit
