name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
      with:
        python-version: "3.12"

    - name: Build and verify distributions
      run: |
        python -m pip install "build==1.5.0" "setuptools==80.9.0" "twine==6.2.0"
        python -m build --no-isolation
        python -m twine check dist/*

    - name: Verify wheel and source distribution against the release tag
      working-directory: /tmp
      run: |
        for distribution in "$GITHUB_WORKSPACE"/dist/*.whl "$GITHUB_WORKSPACE"/dist/*.tar.gz; do
          python -m pip install --no-deps --force-reinstall "$distribution"
          python - "$distribution" <<'PY'
        import importlib.metadata as metadata
        import importlib.util
        import os
        import sys
        from pathlib import Path

        distribution = Path(sys.argv[1]).name
        expected = os.environ["GITHUB_REF_NAME"].removeprefix("v")
        actual = metadata.version("torch-hungarian")
        assert actual == expected, f"release tag {expected!r} != {distribution} version {actual!r}"
        origin = Path(importlib.util.find_spec("torch_linear_assignment").origin).resolve()
        workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
        assert workspace not in origin.parents, f"{distribution} import shadowed by the checkout: {origin}"
        print(f"{distribution}: version {actual} | module {origin}")
        PY
        done

    - name: Upload verified distributions
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
      with:
        name: python-package-distributions
        path: dist/
        if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Download verified distributions
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
      with:
        name: python-package-distributions
        path: dist/

    - name: Publish package
      uses: pypa/gh-action-pypi-publish@27b31702a0e7fc50959f5ad993c78deac1bdfc29
