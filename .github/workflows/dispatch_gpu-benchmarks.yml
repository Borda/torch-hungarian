name: Modal GPU Benchmarks

# Manual trigger for the benchmark presets. The runs, the results table and the run summary live in
# _modal-gpu-benchmarks.yml, which trigger-gpu-labels.yml also calls for the `gpu-benchmarks` label.
# A run costs real money and needs the Modal credentials, so it never runs on push.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or commit SHA to benchmark"
        required: false
        default: ""
      gpu:
        description: "Modal GPU type; compute capability 8.0+ only, so no T4. One type per run, so timings stay comparable; use H100 or A100 to fill that GPU's README rows"
        required: false
        default: "L4"
        type: choice
        options: ["L4", "A10", "L40S", "A100", "H100"]
      preset:
        description: "Benchmark preset to run; all means rfdetr and wide, and readme (the README table shapes) runs only when chosen"
        required: false
        default: "all"
        type: choice
        options: ["all", "rfdetr", "wide", "readme"]
      benchmark_args:
        description: "Extra benchmark arguments, such as --process-rounds 1, or --cold-cache populated to time a first call whose Triton kernels are already compiled on disk"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  gpu-benchmarks-dispatch:
    # The report job needs these; a caller can only pass on permissions it holds itself.
    permissions:
      actions: read
      contents: read
      pull-requests: write
    uses: ./.github/workflows/_modal-gpu-benchmarks.yml
    with:
      ref: ${{ inputs.ref }}
      gpu: ${{ inputs.gpu || 'L4' }}
      preset: ${{ inputs.preset }}
      benchmark_args: ${{ inputs.benchmark_args }}
    secrets: inherit
