name: Modal GPU Tests

# Runs the compiled Triton lane on real NVIDIA hardware through Modal.
# Requires the MODAL_TOKEN_ID and MODAL_TOKEN_SECRET repository secrets.

on:
  push:
    branches: ["main", "develop"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or commit SHA to test"
        required: false
        default: ""
      gpu:
        description: "Modal GPU type without a device count; compute capability 8.0+ only, so no T4. L4 also allows A10 and L40S"
        required: false
        default: "L4"
      nb_devices:
        description: "Optional JSON list of distinct positive device counts; blank selects the default for the tested revision"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  gpu-tests-dispatch:
    # The report job only comments on pull requests, but a caller must grant what a called job asks for.
    permissions:
      actions: read
      contents: read
      pull-requests: write
    uses: ./.github/workflows/_modal-gpu-tests.yml
    with:
      ref: ${{ inputs.ref || github.sha }}
      gpu: ${{ inputs.gpu || 'L4' }}
      nb_devices: ${{ inputs.nb_devices || '' }}
    secrets: inherit
